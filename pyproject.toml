[project]
name = "end-to-end-llmops-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepeval==4.3.1",
    "docx2txt==0.9",
    "faiss-cpu>=1.14.3",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "ipykernel==6.30.0",
    "jinja2==3.1.4",
    "langchain==0.3.27",
    "langchain-community==0.3.27",
    "langchain-core==0.3.72",
    "langchain-google-genai==2.1.8",
    "langchain-groq==0.3.6",
    "langchain-huggingface==0.3.1",
    "langchain-openai==0.2.10",
    "langchain-text-splitters==0.3.9",
    "langsmith==0.10.10",
    "openai>=1.109.1",
    "pandas>=3.0.5",
    "pypdf>=6.21.0",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "python-dotenv==1.1.1",
    "python-multipart==0.0.20",
    "sentence-transformers>=6.1.0",
    "structlog>=26.1.0",
    "tokenizers==0.23.1",
    "transformers==5.17.0",
    "uvicorn==0.32.1",
]

[dependency-groups]
dev = [
    "pip>=26.2.1",
]


[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "[0-9][0-9]_test_*.py"]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
