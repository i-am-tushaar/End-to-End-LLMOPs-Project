
# ==========================================================
# FILE: secret.yaml
# ==========================================================
# DESCRIPTION:
# Stores sensitive credentials required by the LLMOps application.
#
# WHY DO WE NEED IT?
# Our application requires API credentials to connect with
# Groq, Google Gemini and LangSmith.
#
# HOW DOES IT WORK?
# Kubernetes makes Secret values available to the application
# container through environment variables.
#
# IMPORTANT:
# Actual API keys will be added separately using kubectl.
# Never store actual credentials in this file or commit them
# to GitHub.
# ==========================================================

apiVersion: v1                 # Kubernetes API version used for Secrets

kind: Secret                   # Tells Kubernetes to create a Secret

metadata:
  name: llmops-secrets         # Name of the Kubernetes Secret
  namespace: llmops            # Namespace where the Secret is created

type: Opaque                   # General-purpose Secret for storing credentials
