
name: CD - Deploy to AWS ECS Fargate

# Trigger deployment after CI completes
on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed

# GitHub OIDC permissions
permissions:
  id-token: write
  contents: read

# Prevent overlapping deployments
concurrency:
  group: llmops-ecs-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: llmopsrepolive
  ECS_SERVICE: llmops-service
  ECS_CLUSTER: llmops-live-cluster
  ECS_TASK_DEFINITION: infra/task-definition.json
  CONTAINER_NAME: llmops-container

jobs:

  # 1. Verify CI succeeded
  check-status:
    name: Check CI Status
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Confirm CI success
        run: echo "CI passed. Starting deployment."

  # 2. Build and push Docker image to ECR
  build-and-push:
    name: Build and Push Docker Image
    needs: check-status
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      # Checkout the exact commit tested by CI
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Safely inspect GitHub OIDC token claims
      - name: Debug GitHub OIDC Claims
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          separator = "&" if "?" in url else "?"
          url += separator + "audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {request_token}"
              }
          )

          with urllib.request.urlopen(request) as response:
              token = json.loads(response.read())["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("GitHub OIDC Claims:")
          for key in [
              "iss",
              "aud",
              "sub",
              "repository",
              "ref",
              "event_name",
              "workflow"
          ]:
              print(f"{key}: {claims.get(key)}")
          PY

      # Authenticate with AWS using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsDeploy

      # Verify AWS authentication
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push Docker image
      - name: Build and Push Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  # 3. Deploy image to ECS Fargate
  deploy:
    name: Deploy to ECS Fargate
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # Checkout the same commit used to build the image
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Authenticate with AWS using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsDeploy

      # Update image in ECS task definition
      - name: Render ECS Task Definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}

      # Deploy updated task definition to ECS
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # Confirm deployment
      - name: Deployment Successful
        run: echo "LLMOps application deployed successfully to AWS ECS Fargate."
