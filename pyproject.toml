
[project]
name = "end-to-end-llmops-project"
version = "0.1.0"
description = "End-to-End LLMOps project with RAG, evaluation, and deployment workflows"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    # Core
    "python-dotenv==1.1.1",
    "structlog==25.5.0",
    # LangChain ecosystem
    "langchain==0.3.27",
    "langchain-community==0.3.27",
    "langchain-core==0.3.72",
    "langchain-text-splitters==0.3.9",
    "langchain-groq==0.3.6",
    "langchain-google-genai==2.1.8",
    "langchain-openai==0.2.10",
    "langchain-huggingface==0.3.1",
    "langsmith==0.10.10",
    # Document processing
    "pypdf==6.21.0",
    "docx2txt==0.9",
    # Embeddings and transformers
    "sentence-transformers==6.1.0",
    "transformers==5.17.0",
    "tokenizers==0.23.1",
    # Vector database
    "faiss-cpu==1.14.3",
    # API and web framework
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
    "python-multipart==0.0.20",
    "jinja2==3.1.4",
    "httpx==0.28.1",
    # Other dependencies
    "ipykernel==6.30.0",
    "openai==1.109.1",
    "pandas==3.0.5",
    "deepeval==4.3.1",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "[0-9][0-9]_test_*.py"]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
