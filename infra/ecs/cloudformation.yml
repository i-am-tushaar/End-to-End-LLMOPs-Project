AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Infrastructure for the End-to-End LLMOps Project using
  Amazon ECR, Amazon ECS Fargate, CloudWatch, and GitHub Actions OIDC.

Parameters:
  GitHubOwner:
    Type: String
    Default: i-am-tushaar
    Description: GitHub username or organization that owns the repository.

  GitHubRepo:
    Type: String
    Default: End-to-End-LLMOPs-Project
    Description: GitHub repository name.

  ECRRepositoryName:
    Type: String
    Default: llmopsrepolive

  ECSClusterName:
    Type: String
    Default: llmops-live-cluster

  AllowedCidr:
    Type: String
    Default: 127.0.0.1/32
    Description: >
      Replace this default when creating the stack with your public IP
      followed by /32, for example 203.0.113.10/32. Do not use 0.0.0.0/0
      unless you intentionally want the application publicly accessible.

Resources:
  # VPC and public networking for the Fargate task.
  LLMOpsVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: llmops-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref LLMOpsVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LLMOpsVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: llmops-public-subnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref LLMOpsVPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # Restrict inbound access to the CIDR supplied at stack creation.
  LLMOpsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow FastAPI traffic on port 8080 from AllowedCidr.
      VpcId: !Ref LLMOpsVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref AllowedCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: llmops-security-group

  # Docker image repository. Immutable tags work with commit-SHA image tags.
  LLMOpsECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref ECRRepositoryName
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  LLMOpsECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ECSClusterName

  LLMOpsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/llmopstdlive
      RetentionInDays: 14

  # ECS assumes this role to pull from ECR, write logs, and read app secrets.
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadLLMOpsSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:llmops/*'

  # GitHub OIDC provider avoids storing long-lived AWS access keys in GitHub.
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action:
              - sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/main'
      Policies:
        - PolicyName: GitHubECSDeploymentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ECRAuthentication
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'

              - Sid: PushImagesToThisRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !GetAtt LLMOpsECRRepository.Arn

              - Sid: RegisterAndDeployECS
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeServices
                  - ecs:DescribeClusters
                  - ecs:CreateService
                  - ecs:UpdateService
                Resource: '*'

              - Sid: PassOnlyTheTaskExecutionRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt ECSTaskExecutionRole.Arn

Outputs:
  ECRRepositoryUri:
    Description: Docker image repository URI
    Value: !GetAtt LLMOpsECRRepository.RepositoryUri

  ECSClusterName:
    Description: ECS cluster name
    Value: !Ref LLMOpsECSCluster

  PublicSubnetId:
    Description: Public subnet for the Fargate service
    Value: !Ref PublicSubnet

  SecurityGroupId:
    Description: Security group for FastAPI port 8080
    Value: !Ref LLMOpsSecurityGroup

  TaskExecutionRoleArn:
    Description: ECS task execution role ARN. Copy this into task-definition.json.
    Value: !GetAtt ECSTaskExecutionRole.Arn

  GitHubActionsRoleArn:
    Description: GitHub Actions OIDC deployment role ARN. Add this as GitHub variable AWS_ROLE_ARN.
    Value: !GetAtt GitHubActionsDeployRole.Arn

  LogGroupName:
    Description: CloudWatch log group
    Value: !Ref LLMOpsLogGroup
